spring.application.name=photodiscovery-backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/PhotoDiscoveryDb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

server.error.include-message=never
server.error.include-stacktrace=never

photodiscovery.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
photodiscovery.jwt.secret=${JWT_SECRET:}
photodiscovery.jwt.ttl-seconds=${JWT_TTL_SECONDS:86400}

unsplash.base-url=https://api.unsplash.com
unsplash.access-key=${UNSPLASH_ACCESS_KEY:}
unsplash.secret-key=${UNSPLASH_SECRET_KEY:}
