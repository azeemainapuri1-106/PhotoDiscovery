spring.datasource.url=jdbc:h2:mem:photodiscovery;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
photodiscovery.jwt.secret=test-only-secret-key-0123456789abcdef
photodiscovery.jwt.ttl-seconds=3600
photodiscovery.cors.allowed-origin=http://localhost:5173
unsplash.base-url=https://api.unsplash.com
unsplash.access-key=test-only-unsplash-key
unsplash.secret-key=
